name: Build Equinox Windows

on:
  push:
    branches:
      - 'develop'
      - 'feat/**'
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2 and UCRT64 Toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-svg
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-qt6-5compat
            mingw-w64-ucrt-x86_64-libbotan
            mingw-w64-ucrt-x86_64-minizip
            mingw-w64-ucrt-x86_64-qrencode
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-readline

      - name: Configure CMake
        shell: msys2 {0}
        run: |
          mkdir -p build
          cd build
          cmake -G "Ninja" \
            -DCMAKE_BUILD_TYPE=Release \
            -DWITH_TESTS=OFF \
            -DWITH_GUI_TESTS=OFF \
            -DKPXC_FEATURE_DOCS=OFF \
            -DKEEPASSXC_BUILD_TYPE=Release \
            ..

      - name: Build Equinox
        shell: msys2 {0}
        run: |
          cd build
          ninja -j $(nproc)

      - name: Package Standalone Portable Bundle
        shell: msys2 {0}
        run: |
          mkdir -p package/Equinox
          # Copy all generated binaries and helper DLLs from build
          cp build/src/*.exe package/Equinox/ 2>/dev/null || true
          cp build/src/*.dll package/Equinox/ 2>/dev/null || true
          cp package/Equinox/KeePassXC.exe package/Equinox/Equinox.exe 2>/dev/null || true
          
          # Deploy Qt dependencies and plugins
          windeployqt --release --no-translations --compiler-runtime package/Equinox/Equinox.exe || true

          # Explicitly copy critical compiler runtime DLLs
          cp /ucrt64/bin/libstdc++*.dll package/Equinox/ 2>/dev/null || true
          cp /ucrt64/bin/libgcc*.dll package/Equinox/ 2>/dev/null || true
          cp /ucrt64/bin/libwinpthread*.dll package/Equinox/ 2>/dev/null || true

          # Comprehensive Dependency Resolver for UCRT64 runtime DLLs
          python3 -c "
          import os, sys, shutil

          app_dir = 'package/Equinox'
          ucrt_prefix = os.environ.get('MINGW_PREFIX', '/ucrt64')
          candidates = [
              os.path.join(ucrt_prefix, 'bin'),
              'C:/msys64/ucrt64/bin',
              '/ucrt64/bin'
          ]
          ucrt_bin = next((c for c in candidates if os.path.isdir(c)), None)
          print('Using UCRT64 bin dir:', ucrt_bin)

          def get_needed(filepath):
              needed = set()
              try:
                  with open(filepath, 'rb') as f:
                      data = f.read()
                  import re
                  for m in re.finditer(rb'([a-zA-Z0-9_\-\.\+]+\.[dD][lL][lL])\x00', data):
                      dll = m.group(1).decode('ascii', errors='ignore').lower()
                      needed.add(dll)
              except Exception:
                  pass
              return needed

          if ucrt_bin:
              ucrt_map = {f.lower(): f for f in os.listdir(ucrt_bin) if f.lower().endswith('.dll')}
              existing = {f.lower() for f in os.listdir(app_dir)}

              iteration = 0
              while iteration < 10:
                  iteration += 1
                  added = 0
                  all_needed = set()
                  for root, dirs, files in os.walk(app_dir):
                      for f in files:
                          if f.lower().endswith(('.exe', '.dll')):
                              all_needed.update(get_needed(os.path.join(root, f)))

                  for dll in all_needed:
                      if dll not in existing and dll in ucrt_map:
                          real_name = ucrt_map[dll]
                          shutil.copy2(os.path.join(ucrt_bin, real_name), os.path.join(app_dir, real_name))
                          existing.add(dll)
                          added += 1
                          print(f'Bundled runtime DLL: {real_name}')
                  if added == 0:
                      break
          "

          # Copy share resources if present
          if [ -d share ]; then
            cp -r share package/Equinox/
          fi

      - name: Create Zip Archive
        shell: pwsh
        run: |
          Compress-Archive -Path package/Equinox -DestinationPath Equinox-Windows-x64.zip -Force

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Equinox-Windows-x64
          path: Equinox-Windows-x64.zip
          retention-days: 14
